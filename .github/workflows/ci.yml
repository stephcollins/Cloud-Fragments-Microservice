name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install node dependencies and run tests
        run: npm install-ci-test

  # -------------------------------------------------------
  # 🔥 NEW: Integration Tests (Docker + LocalStack + DynamoDB + Hurl)
  # -------------------------------------------------------
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies (including dev deps for Hurl)
        run: npm install

      - name: Make setup script executable
        run: chmod +x ./scripts/local-aws-setup.sh

      # Spin up LocalStack + DynamoDB + Fragments container
      - name: Build containers
        run: docker compose up -d

      - name: Wait for LocalStack
        run: sleep 10

      - name: Setup AWS resources in LocalStack
        run: ./scripts/local-aws-setup.sh

      - name: Run integration tests (Hurl)
        run: npm run test:integration

  # -------------------------------------------------------
  # Docker Hub Build
  # -------------------------------------------------------
  docker-hub:
    name: Build and Push to Docker Hub
    # NEW: Includes integration-tests as required dependency
    needs: [lint, dockerfile-lint, unit-tests, integration-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        env:
          DOCKERHUB_REPO: stephcollins/fragments
          SHA_TAG: sha-${{ github.sha }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:${{ env.SHA_TAG }},
            ${{ env.DOCKERHUB_REPO }}:main,
            ${{ env.DOCKERHUB_REPO }}:latest